<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Academic Poster Render</title>
    <style>
        /* Base Canvas: Soft Gray-Blue Background */
        body { margin: 0; padding: 0; background-color: #eef2f5; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        .canvas {
            position: relative;
            width: 1920px; 
            height: 1080px;
            overflow: hidden;
        }

        /* THE P2P CARD STYLE
           Replaces standard bounding boxes with modern academic cards.
        */
        .content-block {
            position: absolute;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 12px; /* Rounded corners */
            box-shadow: 0 6px 16px rgba(0,0,0,0.06); /* Soft depth shadow */
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* Header Zone Exception: Full Bleed, Dark Academic Blue */
        .content-block[data-zone="header"] {
            background-color: #1a365d; 
            color: #ffffff;
            border-radius: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            padding: 0 50px;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        /* Typography */
        .main-poster-title {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* P2P Section Titles: Subtle underline instead of solid boxes */
        .section-title {
            color: #1a365d;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid #cbd5e1; /* Elegant divider line */
            text-transform: uppercase;
        }

        /* Text & Bullet Points formatting */
        .content-text {
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: justify;
            color: #334155;
            margin-top: 0;
        }

        ul { margin-top: 5px; padding-left: 25px; }
        li { font-size: 1.3rem; line-height: 1.5; color: #334155; margin-bottom: 8px;}

        /* Image Handling */
        .content-block img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            margin: auto;
            border-radius: 8px;
        }

        /* --- DEBUG MODE STYLES --- */
        .debug-mode .content-block { border: 4px solid #ff0055 !important; }
        .debug-badge { position: absolute; top: -4px; left: -4px; background-color: #ff0055; color: white; font-size: 16px; font-weight: bold; padding: 4px 8px; border-bottom-right-radius: 8px; z-index: 999; }
    </style>
</head>
<body class="{% if is_debug %}debug-mode{% endif %}">
    <div class="canvas">
        {% for block in blocks %}
            {% if block.coordinates %}
            <div class="content-block" 
                 id="{{ block.block_id }}"
                 data-zone="{{ block.zone_id }}"
                 data-x="{{ block.coordinates[0] }}"
                 data-y="{{ block.coordinates[1] }}"
                 data-w="{{ block.coordinates[2] }}"
                 data-h="{{ block.coordinates[3] }}">
                
                {% if is_debug %}
                    <div class="debug-badge">{{ block.block_id }}</div>
                {% endif %}

                {% if block.block_type == 'image' %}
                    <img src="{{ block.content }}" alt="Visual Content">
                {% else %}
                    <div style="width: 100%; height: 100%; overflow: hidden;">
                        {{ block.content | safe }}
                    </div>
                {% endif %}

            </div>
            {% endif %}
        {% endfor %}
    </div>

    <script>
        // Apply spatial coordinates
        document.querySelectorAll('.content-block').forEach(function(el) {
            if (el.dataset.x) {
                el.style.left = el.dataset.x + 'px';
                el.style.top = el.dataset.y + 'px';
                el.style.width = el.dataset.w + 'px';
                el.style.height = el.dataset.h + 'px';
            }
        });
    </script>
</body>
</html>
